<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering roadmap: current, advanced, research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="300" fill="#0d1117"/>
  <style>
    .col   { fill: #111a2b; stroke: #2d3d59; stroke-width: 1.5; }
    .head  { font-family: Consolas, 'Courier New', monospace; font-size: 17px; font-weight: bold; }
    .item  { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
    .arrow { stroke: #39d2c0; stroke-width: 2; marker-end: url(#head3); }
  </style>
  <defs>
    <marker id="head3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#39d2c0"/>
    </marker>
  </defs>

  <rect class="col" x="30" y="50" width="260" height="220" rx="10"/>
  <text class="head" x="160" y="80" text-anchor="middle" fill="#58a6ff">CURRENT</text>
  <text class="item" x="50" y="112">• Blockchain dev (ETH, Solana, Fabric)</text>
  <text class="item" x="50" y="136">• Smart contract security basics</text>
  <text class="item" x="50" y="160">• AI/ML exploration</text>
  <text class="item" x="50" y="184">• Full-stack + mobile delivery</text>

  <line class="arrow" x1="290" y1="160" x2="345" y2="160"/>

  <rect class="col" x="350" y="50" width="260" height="220" rx="10"/>
  <text class="head" x="480" y="80" text-anchor="middle" fill="#58a6ff">ADVANCED</text>
  <text class="item" x="370" y="112">• Zero-knowledge systems</text>
  <text class="item" x="370" y="136">• Blockchain infrastructure</text>
  <text class="item" x="370" y="160">• Applied cryptography</text>

  <line class="arrow" x1="610" y1="160" x2="665" y2="160"/>

  <rect class="col" x="670" y="50" width="260" height="220" rx="10" stroke="#39d2c0"/>
  <text class="head" x="800" y="80" text-anchor="middle" fill="#39d2c0">RESEARCH DIRECTION</text>
  <text class="item" x="690" y="112">• AI-assisted contract security</text>
  <text class="item" x="690" y="136">• On-chain analytics with ML</text>
  <text class="item" x="690" y="160">• Post-quantum blockchain (PQRB/Q7)</text>
</svg>
