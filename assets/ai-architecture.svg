<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI engineering direction diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" fill="#0d1117"/>
  <style>
    .node  { fill: #111a2b; stroke: #2d3d59; stroke-width: 1.5; }
    .built { fill: #0f2a26; stroke: #39d2c0; stroke-width: 1.5; }
    .lbl   { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #e6edf3; }
    .sub   { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
    .arrow { stroke: #58a6ff; stroke-width: 2; marker-end: url(#head2); }
  </style>
  <defs>
    <marker id="head2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#58a6ff" font-weight="bold">AI Engineering — Built vs. In Progress</text>

  <text x="60" y="70" font-family="Consolas, monospace" font-size="13" fill="#39d2c0">BUILT</text>
  <rect class="built" x="60" y="80" width="360" height="70" rx="8"/>
  <text class="lbl" x="240" y="108" text-anchor="middle">OrchAgent</text>
  <text class="sub" x="240" y="128" text-anchor="middle">Multi-agent pipeline: contract dev → audit → deploy</text>

  <rect class="built" x="60" y="170" width="360" height="70" rx="8"/>
  <text class="lbl" x="240" y="198" text-anchor="middle">Blockchain + ML Research</text>
  <text class="sub" x="240" y="218" text-anchor="middle">DeFi analytics · contract-security signals · zk/MPC</text>

  <text x="480" y="70" font-family="Consolas, monospace" font-size="13" fill="#8b949e">IN PROGRESS / LEARNING</text>
  <rect class="node" x="480" y="80" width="360" height="70" rx="8"/>
  <text class="lbl" x="660" y="108" text-anchor="middle">RAG &amp; Agent Frameworks</text>
  <text class="sub" x="660" y="128" text-anchor="middle">LangChain/LangGraph, vector DBs, evaluation</text>

  <rect class="node" x="480" y="170" width="360" height="70" rx="8"/>
  <text class="lbl" x="660" y="198" text-anchor="middle">Local / Privacy-Conscious Inference</text>
  <text class="sub" x="660" y="218" text-anchor="middle">Ollama, offline-tolerant AI workflows</text>

  <line class="arrow" x1="240" y1="150" x2="240" y2="266"/>
  <line class="arrow" x1="660" y1="240" x2="660" y2="266"/>
  <rect class="node" x="150" y="270" width="600" height="60" rx="8" stroke="#39d2c0"/>
  <text class="lbl" x="450" y="298" text-anchor="middle">Where Blockchain Meets AI</text>
  <text class="sub" x="450" y="316" text-anchor="middle">AI verifying &amp; monitoring trust systems, not replacing them</text>
</svg>
