<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blockchain engineering layers diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#0d1117"/>
  <style>
    .layer { fill: #111a2b; stroke: #2d3d59; stroke-width: 1.5; }
    .lbl   { font-family: Consolas, 'Courier New', monospace; font-size: 18px; fill: #e6edf3; }
    .sub   { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
    .arrow { stroke: #39d2c0; stroke-width: 2; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#39d2c0"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#58a6ff" font-weight="bold">Blockchain Engineering Layers</text>

  <g>
    <rect class="layer" x="150" y="60" width="600" height="56" rx="8"/>
    <text class="lbl" x="450" y="88" text-anchor="middle">Blockchain Applications</text>
    <text class="sub" x="450" y="106" text-anchor="middle">dApps · wallets · marketplaces · dashboards</text>
  </g>

  <line class="arrow" x1="450" y1="116" x2="450" y2="140"/>

  <g>
    <rect class="layer" x="150" y="144" width="600" height="56" rx="8"/>
    <text class="lbl" x="450" y="172" text-anchor="middle">Smart Contracts</text>
    <text class="sub" x="450" y="190" text-anchor="middle">Solidity · escrow logic · state machines · tokens</text>
  </g>

  <line class="arrow" x1="450" y1="200" x2="450" y2="224"/>

  <g>
    <rect class="layer" x="150" y="228" width="600" height="56" rx="8"/>
    <text class="lbl" x="450" y="256" text-anchor="middle">Security &amp; Testing</text>
    <text class="sub" x="450" y="274" text-anchor="middle">access control · reentrancy · commit-reveal · Hardhat/Foundry</text>
  </g>

  <line class="arrow" x1="450" y1="284" x2="450" y2="308"/>

  <g>
    <rect class="layer" x="150" y="312" width="600" height="56" rx="8"/>
    <text class="lbl" x="450" y="340" text-anchor="middle">Cryptography</text>
    <text class="sub" x="450" y="358" text-anchor="middle">hashing · signatures · commitment schemes · ZK research</text>
  </g>

  <line class="arrow" x1="450" y1="368" x2="450" y2="392"/>

  <g>
    <rect class="layer" x="150" y="396" width="600" height="56" rx="8"/>
    <text class="lbl" x="450" y="424" text-anchor="middle">Consensus &amp; Infrastructure</text>
    <text class="sub" x="450" y="442" text-anchor="middle">JSON-RPC nodes · light clients · DKG · explorers</text>
  </g>

  <line class="arrow" x1="450" y1="452" x2="450" y2="476"/>

  <g>
    <rect class="layer" x="150" y="480" width="600" height="40" rx="8" fill="#0f2a26" stroke="#39d2c0"/>
    <text class="lbl" x="450" y="505" text-anchor="middle" fill="#39d2c0">Layer 2 / Zero-Knowledge Research</text>
  </g>
</svg>
